import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.nio.file.AtomicMoveNotSupportedException
import java.time.Instant

def cleanIdentifier = { value ->
    value != null && value.toString().length() <= 240 && value.toString() ==~ /[A-Za-z_$][A-Za-z0-9_$.]*/ ? value.toString() : null
}

gradle.projectsEvaluated {
    allprojects {
        tasks.withType(Test).all { task ->
            def matrixRoot = System.getenv('ST_MATRIX_REPORTS')
            def testRoot = System.getenv('ST_TEST_REPORT_DIR')
            if (!matrixRoot && !testRoot) return
            def directory = new File(matrixRoot ?: testRoot, task.name)
            def cases = []
            if (matrixRoot) {
                task.reports.junitXml.destination = new File(directory, 'xml')
                task.reports.html.destination = new File(directory, 'html')
            }
            def matrixProfile = new File(matrixRoot ?: testRoot).name
            def binding = [kind: 'matrix', profile: matrixProfile in ['root-build', 'core-baseline', 'core-classes', 'proxy-tests'] ? matrixProfile : null]
            boolean progressEnabled = true
            boolean warned = false
            def bestEffort = { action ->
                if (!progressEnabled) return
                try { action() } catch (Exception ignored) {
                    progressEnabled = false
                    if (!warned) {
                        warned = true
                        try { System.err.println('test progress unavailable; test outcome remains authoritative') } catch (Exception ignoredAgain) { }
                    }
                }
            }
            def progressDir = new File(matrixRoot ?: testRoot, 'progress')
            def prefix = task.path.replace(':', '_') + '-' + UUID.randomUUID()
            def progress = new File(progressDir, prefix + '.jsonl')
            def snapshot = new File(progressDir, prefix + '.json')
            def snapshotTemp = new File(progressDir, prefix + '.tmp')
            bestEffort {
                if (testRoot && !matrixRoot) {
                    def reports = new File(testRoot)
                    def invocation = new JsonSlurper().parse(new File(reports.parentFile, 'invocation.json'))
                    if (!(invocation.nonce instanceof String) || !(invocation.nonce ==~ /[a-f0-9]{48}/) ||
                        invocation.nonce != System.getenv('ST_ARTIFACT_NONCE') || reports.name != 'reports' ||
                        reports.parentFile.name != invocation.nonce || reports.canonicalFile != reports.absoluteFile ||
                        !(invocation.mode in ['ordinary', 'retrofit', 'mutation', 'upgrade', 'exposed']) ||
                        !(invocation.sources instanceof String) || !(invocation.sources ==~ /[a-f0-9]{64}/) ||
                        !(invocation.progressScriptSha256 instanceof String) || !(invocation.progressScriptSha256 ==~ /[a-f0-9]{64}/)) {
                        throw new IllegalStateException('Invalid test progress invocation binding')
                    }
                    binding = [kind: 'testapp', invocation: invocation.nonce, profile: invocation.mode, sources: invocation.sources,
                               progressScriptSha256: invocation.progressScriptSha256]
                }
                if (!progressDir.isDirectory() && !progressDir.mkdirs()) throw new IOException('Cannot create progress directory')
            }
            def lock = new Object()
            def active = new IdentityHashMap()
            def activeOrder = []
            boolean activeOverflow = false
            long sequence = 0
            long nextTest = 0
            def transport = { descriptor ->
                def name = (descriptor.className ?: '').toLowerCase(Locale.ROOT)
                name.contains('retrofit') ? 'retrofit' : name.contains('okhttp') ? 'okhttp' :
                    name.contains('httpurlconnection') ? 'httpurlconnection' : null
            }
            def emit = { event ->
                synchronized (lock) {
                    sequence++
                    bestEffort {
                        def common = [schema: 1, binding: binding, task: task.path.replace(':', '_'), sequence: sequence,
                                      timestamp: Instant.now().toString(), monotonicNanos: System.nanoTime()]
                        if (sequence <= 10000) {
                            def record = common + (sequence == 10000 ? [event: 'truncated'] : event)
                            def stream = new FileOutputStream(progress, true)
                            try { stream.write((JsonOutput.toJson(record) + '\n').getBytes(StandardCharsets.UTF_8)) }
                            finally { stream.close() }
                        }
                        snapshotTemp.text = JsonOutput.toJson(common + [historyTruncated: sequence >= 10000,
                            activeOverflow: activeOverflow, active: active.values().toList()])
                        try { Files.move(snapshotTemp.toPath(), snapshot.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING) }
                        catch (AtomicMoveNotSupportedException ignored) {
                            Files.move(snapshotTemp.toPath(), snapshot.toPath(), StandardCopyOption.REPLACE_EXISTING)
                        }
                    }
                }
            }
            task.beforeTest { descriptor ->
                synchronized (lock) {
                    def id = ++nextTest
                    if (active.size() >= 1024) {
                        active.remove(activeOrder.remove(0))
                        activeOverflow = true
                    }
                    def detail = [test: id, className: cleanIdentifier(descriptor.className),
                                  method: cleanIdentifier(descriptor.name), transportHint: transport(descriptor),
                                  startedAt: Instant.now().toString(), startedNanos: System.nanoTime()]
                    active.put(descriptor, detail)
                    activeOrder.add(descriptor)
                    emit([event: 'start'] + detail)
                }
            }
            task.afterTest { descriptor, result ->
                synchronized (lock) {
                    cases.add([name: descriptor.name, className: descriptor.className, result: result.resultType.toString()])
                    def detail = active.remove(descriptor)
                    def index = activeOrder.findIndexOf { item -> item.is(descriptor) }
                    if (index >= 0) activeOrder.remove(index)
                    emit([event: 'finish', test: detail?.test, className: cleanIdentifier(descriptor.className),
                          method: cleanIdentifier(descriptor.name), transportHint: transport(descriptor),
                          result: result.resultType.toString()])
                }
            }
            task.afterSuite { descriptor, result ->
                if (matrixRoot && descriptor.parent == null) {
                    directory.mkdirs()
                    new File(directory, 'result.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                        tests: result.testCount, passed: result.successfulTestCount, skipped: result.skippedTestCount,
                        failed: result.failedTestCount, cases: cases, tasks: gradle.taskGraph.allTasks*.path,
                        requested: gradle.startParameter.taskNames, excluded: gradle.startParameter.excludedTaskNames,
                        classpath: task.classpath.files*.absolutePath
                    ]))
                }
            }
        }
    }
}
