apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
def publishVersionID = "0.6.0"

android {
    lintOptions {
        abortOnError true
        error 'NewApi'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    compileSdkVersion 32
    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 32
        versionCode 1
        versionName publishVersionID
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            ['seed', 'threads', 'operations', 'watchdogSeconds'].each { option ->
                def key = "session.stress.${option}"
                if (project.hasProperty(key)) systemProperty key, project.property(key)
            }
        }
        if (project.hasProperty('coreProtocolUrl')) {
            unitTests.all { systemProperty 'coreProtocolUrl', project.property('coreProtocolUrl') }
        }
    }
    if (project.hasProperty('coreProtocolUrl')) {
        sourceSets.test.java.srcDir 'src/coreTest/java'
    }
    sourceSets.androidTest.java.srcDir 'src/coreTest/java'

    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    groupId = 'com.supertokens'
                    artifactId = 'session'
                    version = publishVersionID

                    from components.release
                }
            }
        }
    }

    libraryVariants.all { variant ->

        task("generate${variant.name.capitalize()}Javadoc", type: Javadoc) {
            title = "Documentation for Android $android.defaultConfig.versionName b$android.defaultConfig.versionCode"
            destinationDir = new File("${project.getProjectDir()}/../docs")
            source = variant.javaCompile.source

            ext.androidJar = "${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar"
            doFirst { classpath = files(variant.javaCompile.classpath.files) + files(ext.androidJar) }

            description "Generates Javadoc for $variant.name."

            options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PUBLIC
            options.links("http://docs.oracle.com/javase/7/docs/api/");
            options.links("http://developer.android.com/reference/");
            exclude '**/BuildConfig.java'
            exclude '**/R.java'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    compileOnly "com.squareup.okhttp3:okhttp:4.1.0"
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'com.google.code.gson:gson:2.8.5'
    testImplementation 'com.squareup.okhttp3:okhttp:4.1.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.1.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.1.0'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    testImplementation 'com.squareup.retrofit2:retrofit:2.3.0'
    testImplementation 'com.squareup.retrofit2:converter-gson:2.3.0'
}

configurations {
    legacy054 { transitive = false }
    legacy054DriverDependencies { transitive = true }
}

dependencies {
    legacy054 'com.github.supertokens:supertokens-android:0.5.4@aar'
    legacy054DriverDependencies 'com.squareup.okhttp3:okhttp:4.1.0'
}

def legacy054Checksum = file('src/test/compatibility/legacy054.sha256')
def legacy054Jar = file("$buildDir/legacy054/classes.jar")
def legacy054DriverClasses = file("$buildDir/legacy054/driver")

task extractLegacy054 {
    inputs.files configurations.legacy054
    inputs.file legacy054Checksum
    outputs.file legacy054Jar
    doLast {
        def aar = configurations.legacy054.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        aar.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != legacy054Checksum.text.trim()) {
            throw new GradleException("Unexpected 0.5.4 AAR checksum: $actual")
        }
        copy {
            from zipTree(aar)
            include 'classes.jar'
            into legacy054Jar.parentFile
        }
        if (!legacy054Jar.isFile()) throw new GradleException('0.5.4 AAR has no classes.jar')
    }
}

task compileLegacy054Driver(type: JavaCompile, dependsOn: extractLegacy054) {
    source = fileTree('src/legacyDriver/java') { include '**/*.java' }
    destinationDir = legacy054DriverClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    // Variant compile classpaths include candidate SDK classes and cannot be used here.
    classpath = files(legacy054Jar, android.bootClasspath) + configurations.legacy054DriverDependencies
}

def controlledOracleExecution = [recorder: null, verified: false]

task legacy054Test(type: Test, dependsOn: compileLegacy054Driver) {
    description = 'Runs isolated published-0.5.4 oracle tests (COMPATIBILITY_PLAN.md M0).'
    group = 'verification'
    filter {
        includeTestsMatching 'com.supertokens.session.legacy054.*Test'
        failOnNoMatchingTests = true
    }
    inputs.file legacy054Jar
    inputs.dir legacy054DriverClasses
    systemProperty 'legacy054.jar', legacy054Jar.absolutePath
    systemProperty 'legacy054.driver', legacy054DriverClasses.absolutePath
    inputs.file file('src/test/compatibility/controlled-oracle-recorder.groovy')
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    ignoreFailures = false
    doFirst {
        controlledOracleExecution.recorder = null
        controlledOracleExecution.verified = false
        def recorderFactory = new GroovyShell().evaluate(file('src/test/compatibility/controlled-oracle-recorder.groovy'))
        controlledOracleExecution.recorder = recorderFactory()
    }
    afterTest { descriptor, result ->
        controlledOracleExecution.recorder.record(descriptor.className, descriptor.name, result.resultType.name())
    }
    doLast {
        try {
            controlledOracleExecution.recorder.verify()
            controlledOracleExecution.verified = true
        } catch (IllegalStateException failure) {
            throw new GradleException(failure.message, failure)
        }
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && result.testCount == 0) {
            throw new GradleException('legacy054Test discovered no tests')
        }
    }
}

task verifyRequiredLegacyRefreshCases {
    doLast {
        if (legacy054Test.state.failure != null) return
        if (!legacy054Test.state.executed || legacy054Test.state.skipped ||
                controlledOracleExecution.recorder == null || !controlledOracleExecution.verified) {
            throw new GradleException('legacy054Test did not execute and verify required controlled oracle methods')
        }
    }
}
legacy054Test.finalizedBy verifyRequiredLegacyRefreshCases

afterEvaluate {
    def androidTests = tasks.getByName('testDebugUnitTest')
    legacy054Test.dependsOn androidTests.taskDependencies.getDependencies(androidTests)
    legacy054Test.testClassesDirs = androidTests.testClassesDirs
    legacy054Test.classpath = androidTests.classpath
    legacy054Test.systemProperties.putAll(androidTests.systemProperties)
    tasks.withType(Test).matching { it.name != 'legacy054Test' }.all {
        exclude '**/legacy054/**'
    }
}

apply from: 'src/test/compatibility/api-compatibility.gradle'
apply from: 'src/test/compatibility/okhttp-matrix.gradle'

apply from: 'src/test/compatibility/upgrade-harness.gradle'
// AGP needs Java 8 defaults to supply test lambda stubs; publish only Java 7 production classes.
android.libraryVariants.all { variant ->
    variant.javaCompileProvider.configure {
        sourceCompatibility = JavaVersion.VERSION_1_7.toString()
        targetCompatibility = JavaVersion.VERSION_1_7.toString()
    }
}
