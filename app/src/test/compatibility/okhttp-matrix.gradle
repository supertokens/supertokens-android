// Each lane recompiles tests; production remains the ordinary published-compatible binary.
def lanes = [
    OkHttp312: [okhttp: '3.12.13', okio: '1.15.0', kotlin: '1.3.41', owned: false],
    OkHttp410: [okhttp: '4.1.0', okio: '2.2.2', kotlin: '1.3.41', owned: true],
    OkHttp412: [okhttp: '4.12.0', okio: '3.6.0', kotlin: '1.9.10', owned: true],
    OkHttp5: [okhttp: '5.5.1', okio: '3.18.1', kotlin: '2.2.21', owned: true]
]

repositories.mavenCentral {
    content { onlyForConfigurations(*lanes.keySet().collect { "matrix$it" }) }
}

// AGP supplies transformed Android/test support JARs. Replace only these dependency families.
def replaced = { File file ->
    file.name ==~ /(?:jetified-)?(?:okhttp(?:-.*)?|mockwebserver(?:3)?|okio(?:-.*)?|kotlin-.*|junit|bcprov-.*)-[0-9].*\.jar/
}

task okhttpMatrix { group = 'verification' }

afterEvaluate {
    def ordinary = tasks.getByName('testDebugUnitTest')
    def ordinaryCompile = tasks.getByName('compileDebugUnitTestJavaWithJavac')
    lanes.each { suffix, lane ->
        def dependencies = configurations.create("matrix${suffix}") {
            canBeConsumed = false
            canBeResolved = true
            attributes {
                attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE, objects.named(org.gradle.api.attributes.Usage, 'java-runtime'))
                attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE, objects.named(org.gradle.api.attributes.Category, 'library'))
                attribute(org.gradle.api.attributes.LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(org.gradle.api.attributes.LibraryElements, 'jar'))
                attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 11)
                attribute(org.gradle.api.attributes.Attribute.of('org.jetbrains.kotlin.platform.type', String), 'jvm')
            }
            resolutionStrategy.eachDependency { dependency ->
                if (dependency.requested.group == 'com.squareup.okhttp3') dependency.useVersion(lane.okhttp)
                if (dependency.requested.group == 'com.squareup.okio') dependency.useVersion(lane.okio)
                if (dependency.requested.group == 'org.jetbrains.kotlin') dependency.useVersion(lane.kotlin)
                if (dependency.requested.group == 'junit') dependency.useVersion('4.13.2')
            }
            resolutionStrategy.dependencySubstitution {
                if (suffix == 'OkHttp5') substitute module('com.squareup.okhttp3:okhttp') with module("com.squareup.okhttp3:okhttp-jvm:${lane.okhttp}")
                if (lane.okio.startsWith('3.')) substitute module('com.squareup.okio:okio') with module("com.squareup.okio:okio-jvm:${lane.okio}")
            }
        }
        ['okhttp', 'mockwebserver', 'okhttp-tls'].each {
            project.dependencies.add(dependencies.name, "com.squareup.okhttp3:$it:${lane.okhttp}")
        }
        project.dependencies.add(dependencies.name, "com.squareup.okio:okio:${lane.okio}")
        project.dependencies.add(dependencies.name, "org.jetbrains.kotlin:kotlin-stdlib:${lane.kotlin}")
        project.dependencies.add(dependencies.name, 'junit:junit:4.13.2')

        def directory = file("$buildDir/okhttp-matrix/$suffix")
        def compile = tasks.create("compile${suffix}Tests", JavaCompile) {
            dependsOn ordinary.taskDependencies.getDependencies(ordinary)
            source fileTree('src/test/java') { include '**/*.java' }
            destinationDir = new File(directory, 'classes')
            sourceCompatibility = '1.8'
            targetCompatibility = '1.8'
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-proc:none']
            // AGP keeps Android headers outside ordinaryCompile.classpath; runtime keeps its mockable jar.
            classpath = ordinaryCompile.classpath.filter { !replaced(it) } + dependencies + files(android.bootClasspath)
        }
        def driver = tasks.create("compile${suffix}OracleDriver", JavaCompile) {
            dependsOn extractLegacy054
            source fileTree('src/legacyDriver/java') { include '**/*.java' }
            destinationDir = new File(directory, 'driver')
            sourceCompatibility = '1.8'
            targetCompatibility = '1.8'
            classpath = files("$buildDir/legacy054/classes.jar", android.bootClasspath) + dependencies
        }
        def test = tasks.create("test${suffix}", Test) {
            group = 'verification'
            description = "Full JVM + published oracle against OkHttp ${lane.okhttp}; owned transport=${lane.owned}"
            dependsOn compile, driver
            // The oracle loader reads these outside Test.classpath; path properties do not fingerprint bytes.
            inputs.file file("$buildDir/legacy054/classes.jar")
            inputs.dir driver.destinationDir
            testClassesDirs = files(compile.destinationDir)
            classpath = files(compile.destinationDir) + (ordinary.classpath - ordinary.testClassesDirs).filter { !replaced(it) } + dependencies
            // Undo the ordinary task's oracle exclusion: this lane has its own isolated driver.
            setExcludes([])
            systemProperties ordinary.systemProperties.findAll { key, value -> key != 'coreProtocolUrl' }
            systemProperty 'legacy054.jar', file("$buildDir/legacy054/classes.jar").absolutePath
            systemProperty 'legacy054.driver', driver.destinationDir.absolutePath
            systemProperty 'session.matrix.owned', lane.owned.toString()
            systemProperty 'session.matrix.okhttp', lane.okhttp
            maxParallelForks = 1
            reports.junitXml.destination = new File(directory, 'xml')
            reports.html.destination = new File(directory, 'html')
            doFirst {
                if (JavaVersion.current() != JavaVersion.VERSION_11) throw new GradleException('Matrix uses JDK11 / Gradle6.5; do not run Gradle on JDK17')
                directory.mkdirs()
                def artifacts = dependencies.resolvedConfiguration.resolvedArtifacts
                new File(directory, 'dependencies.txt').text = artifacts.collect { artifact ->
                    def id = artifact.moduleVersion.id
                    def expected = id.group == 'com.squareup.okhttp3' ? lane.okhttp : id.group == 'com.squareup.okio' ? lane.okio : id.group == 'org.jetbrains.kotlin' ? lane.kotlin : null
                    if (expected && id.version != expected) throw new GradleException("Matrix drift: $id expected $expected")
                    def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex()
                    "$id $hash"
                }.sort().join('\n') + '\n'
                ['okhttp3/OkHttpClient.class', 'okhttp3/mockwebserver/MockWebServer.class', 'okhttp3/tls/HeldCertificate.class', 'okio/Buffer.class', 'kotlin/Unit.class'].each { entry ->
                    def providers = classpath.files.findAll { file ->
                        if (!file.isFile() || !file.name.endsWith('.jar')) return false
                        def zip = new java.util.zip.ZipFile(file)
                        try { return zip.getEntry(entry) != null } finally { zip.close() }
                    }
                    if (providers.size() != 1 || !dependencies.files.contains(providers.first())) {
                        throw new GradleException("Matrix classpath contamination: $entry -> $providers")
                    }
                }
                new File(directory, 'classpath.txt').text = classpath.asPath
            }
            afterSuite { descriptor, result ->
                if (descriptor.parent == null && (result.testCount == 0 || result.skippedTestCount != 0)) {
                    throw new GradleException("Matrix must execute tests without skips: ${result.testCount}/${result.skippedTestCount}")
                }
            }
        }
        okhttpMatrix.dependsOn test
    }
}
