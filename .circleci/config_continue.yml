version: 2.1
orbs:
  continuation: circleci/continuation@0.1.2
  slack: circleci/slack@3.4.2
  jq: circleci/jq@2.2.0
jobs:
  test-dev-tag-as-not-passed:
    docker:
      - image: rishabhpoddar/supertokens_website_sdk_testing_node_16
    steps:
      - run: echo "Testing branch << pipeline.git.branch >>"
      - when:
          condition:
            not:
              matches:
                pattern: "^test-cicd/.*$"
                value: << pipeline.git.branch >>
          steps:
            - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/ # This makes npm use http instead of ssh (required for node 16)
            - checkout
            - run: (cd .circleci/ && ./markDevTagAsTestNotPassed.sh)
  test-unit:
    docker: 
      - image: rishabhpoddar/supertokens_android_sdk_testing
    environment:
      JVM_OPTS: -Xmx3200m
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    parameters:
      fdi-version:
        type: string
    steps:
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/ # This makes npm use http instead of ssh (required for node 16)
      - checkout
      - run: apt-get clean
      - run: apt-get purge mysql* -y
      - run: apt-get update
      - run: apt-get install -f
      - run: apt-get upgrade -y
      - run: update-ca-certificates -f
      - run: cd / && wget https://download.java.net/java/GA/jdk15.0.1/51f4f36ad4ef43e39d0dfdbaf6549e32/9/GPL/openjdk-15.0.1_linux-x64_bin.tar.gz
      - run: cd / && mv openjdk-15.0.1_linux-x64_bin.tar.gz /usr/java
      - run: cd /usr/java && tar -xzvf openjdk-15.0.1_linux-x64_bin.tar.gz
      - run:
          name: Install JDK 21 for Core
          command: |
            curl -fL --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.7%2B6/OpenJDK21U-jdk_x64_linux_hotspot_21.0.7_6.tar.gz' -o /usr/java/jdk21.tar.gz
            mkdir -p /usr/java/jdk-21
            tar -xzf /usr/java/jdk21.tar.gz -C /usr/java/jdk-21 --strip-components=1
            /usr/java/jdk-21/bin/java -version
      - run: cd / && echo 'JAVA_HOME=/usr/java/jdk-15.0.1' >> /etc/profile
      - run: cd / && echo 'PATH=$PATH:$HOME/bin:$JAVA_HOME/bin' >> /etc/profile
      - run: cd / && echo 'export JAVA_HOME' >> /etc/profile
      - run: cd / && echo 'export JRE_HOME' >> /etc/profile
      - run: cd / && echo 'export PATH' >> /etc/profile
      - run: cd / && update-alternatives --install "/usr/bin/java" "java" "/usr/java/jdk-15.0.1/bin/java" 2
      - run: cd / && update-alternatives --install "/usr/bin/javac" "javac" "/usr/java/jdk-15.0.1/bin/javac" 2
      - run: curl https://raw.githubusercontent.com/creationix/nvm/master/install.sh | bash
      - run:
          name: Swap node versions
          command: |
            set +e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            nvm install 16

            echo 'export NVM_DIR="$HOME/.nvm"' >> $BASH_ENV
            echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> $BASH_ENV
      - run: (cd .circleci/ && ./doTests.sh  << parameters.fdi-version >>)
      - store_test_results:
          path: testHelpers/testapp/app/build/test-results
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: testHelpers/testapp/app/build/reports/tests
          destination: integration-test-reports
      - store_artifacts:
          path: app/build/reports/tests
          destination: android-test-reports
      - store_artifacts:
          path: ../supertokens-root/logs
          destination: logfiles
  test-success:
    docker:
      - image: rishabhpoddar/supertokens_website_sdk_testing_node_16
    steps:
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/ # This makes npm use http instead of ssh (required for node 16)
      - checkout
      - run: (cd .circleci/ && ./markAsSuccess.sh)
      - slack/status

workflows:
  version: 2
  tagged-build:
    jobs:
      - test-dev-tag-as-not-passed:
          filters:
            tags:
              only: /dev-v[0-9]+(\.[0-9]+)*/
            branches:
              only: /test-cicd\/.*/
      - test-unit:
          requires:
            - test-dev-tag-as-not-passed
          context:
            - slack-notification
          filters:
            tags:
              only: /dev-v[0-9]+(\.[0-9]+)*/
            branches:
              only: /test-cicd\/.*/
          matrix:
            parameters:
              fdi-version: placeholder
      - test-success:
          requires:
            - test-unit
          context:
            - slack-notification
          filters:
            tags:
              only: /dev-v[0-9]+(\.[0-9]+)*/
            branches:
              ignore: /.*/
